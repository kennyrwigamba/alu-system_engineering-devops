<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fafaf9">
  <title>404 — Page not found</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1c2128;
      --muted: #6b7280;
      --line: #e5e7eb;
      --paper: #ffffff;
      --accent: #2563eb;
      --accent-soft: #eef2ff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      padding: 32px;
      background: #fafaf9;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    }

    main {
      width: min(560px, 100%);
      text-align: center;
      padding: clamp(40px, 6vw, 64px) clamp(28px, 5vw, 48px);
    }

    .code {
      margin: 0;
      color: var(--accent);
      font-size: clamp(4.5rem, 14vw, 6.5rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
    }

    h1 {
      margin: 18px 0 12px;
      font-size: clamp(1.35rem, 3vw, 1.65rem);
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .required-copy {
      display: inline-block;
      margin: 0 0 22px;
      padding: 6px 16px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.95rem;
      font-weight: 600;
    }

    .explanation {
      max-width: 420px;
      margin: 0 auto 32px;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.6;
    }

    .button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 46px;
      padding: 0 22px;
      border: 1px solid var(--ink);
      border-radius: 10px;
      background: var(--ink);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      transition: transform 150ms ease, background 150ms ease;
    }

    .button:hover {
      background: #000;
      transform: translateY(-1px);
    }

    .button:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    footer {
      margin-top: 40px;
      color: #9ca3af;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">404</p>
    <h1>This page took a wrong turn.</h1>
    <p class="required-copy">Ceci n'est pas une page</p>
    <p class="explanation">
      The link you followed doesn't lead anywhere on this server.
      It may have moved, or never existed at all.
    </p>
    <a class="button" href="/">
      <span aria-hidden="true">&larr;</span>
      Back to home
    </a>
    <footer>Error code 404 &middot; Not Found</footer>
  </main>
</body>
</html>
